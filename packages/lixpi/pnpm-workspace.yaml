packages:
  - "auth-service"
  - "auth-client"
  - "capability-system"
  - "canvas-engine"
  - "canvas-components"
  - "canvas-components-lixpi-specific"
  - "constants/ts"
  - "debug-tools/ts"
  - "dynamodb-service"
  - "nats-auth-callout-service"
  - "nats-service/ts"
  - "prosemirror"
  - "test-utils"
  - "ui-kit"
  - "ui-kit-gentelella"
  - "ui-primitives"
  - "usage-reporter"
  - "web-client-service-factory"

# Shared tests install the complete package workspace. These are the build
# dependencies explicitly allowed by the service workspaces that consume it.
allowBuilds:
  "@google/genai": true
  "@parcel/watcher": true
  browser-tabs-lock: true
  esbuild: true
  protobufjs: true
  sharp: true
