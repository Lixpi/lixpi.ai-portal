include:
    - docker-compose.typescript-test-runner.yml
    - docker-compose.typescript-quality-runner.yml

services:

    lixpi-dynamodb:
        container_name: lixpi-dynamodb
        profiles: ["main", "deploy"]
        image: amazon/dynamodb-local:latest
        user: "0:0"  # run as root so the volume is writable
        command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/data", "-cors", "*", "-delayTransientStatuses"]
        ports:
            - 8000:8000
        volumes:
            - dynamodb-data:/data
        networks:
            - nats
        healthcheck:
            test: ["CMD-SHELL", "java -version || exit 1"]
            interval: 5s
            timeout: 5s
            retries: 5
            start_period: 5s

    lixpi-dynamodb-admin:
        container_name: lixpi-dynamodb-admin
        profiles: ["dev"]
        image: aaronshaf/dynamodb-admin
        environment:
            DYNAMO_ENDPOINT: http://lixpi-dynamodb:8000
            AWS_REGION: us-east-1
            AWS_ACCESS_KEY_ID: test
            AWS_SECRET_ACCESS_KEY: test
        ports:
            - 8001:8001
        networks:
            - nats
        depends_on:
            lixpi-dynamodb:
                condition: service_healthy
                restart: true

    # Internal AI model registry for provider parameters, model compatibility,
    # implementation state, and UI exposure decisions. Each parameter is one
    # JSON file under services/ai-model-registry/data/params/.
    lixpi-ai-model-registry:
        container_name: lixpi-ai-model-registry
        profiles: ["dev"]
        image: lixpi/ai-model-registry
        build:
            dockerfile: services/ai-model-registry/Dockerfile
            context: .
        environment:
            # Vite serves the page on CLIENT_PORT and proxies /api to the Node
            # server on PORT. In the built image the Node server serves both on
            # 3010 and Vite is not involved.
            CLIENT_PORT: 3010
            PORT: 3011
            PARAMS_DIR: /usr/src/service/data/params
            MODEL_CATALOG_DIR: /usr/src/service/data/model-catalog
            # The scheduled sync stays off locally. Run one by hand with
            # `docker compose exec lixpi-ai-model-registry node --experimental-transform-types ./src/catalog/cli.ts`,
            # which writes the fetched files and, without --no-write, the local DynamoDB.
            MODEL_CATALOG_SYNC_ENABLED: "false"
            NATS_SERVERS: ${NATS_SERVERS}
            NATS_AI_MODEL_REGISTRY_NKEY_SEED: ${NATS_AI_MODEL_REGISTRY_NKEY_SEED}
            NATS_AI_MODEL_REGISTRY_USER_ID: ${NATS_AI_MODEL_REGISTRY_USER_ID}
            MODEL_CATALOG_WRITE_FILES: "true"
            ORG_NAME: ${ORG_NAME}
            STAGE: ${STAGE}
            AWS_REGION: ${AWS_REGION}
            AWS_PROFILE: ${AWS_PROFILE}
            DYNAMODB_ENDPOINT: ${DYNAMODB_ENDPOINT}
            OPENAI_API_KEY: ${OPENAI_API_KEY}
            ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
            ANTHROPIC_USE_AWS_BEDROCK_INFERENCE: ${ANTHROPIC_USE_AWS_BEDROCK_INFERENCE}
            GOOGLE_API_KEY: ${GOOGLE_API_KEY}
        volumes:
            # Only sources are mounted. public/ is build output and stays inside
            # the container, where node_modules also lives.
            - ./services/ai-model-registry/src:/usr/src/service/src:cached
            - ./services/ai-model-registry/vite.config.ts:/usr/src/service/vite.config.ts:cached
            # Mounted so a dependency added on the host is installed by the next
            # container start, without rebuilding the image.
            #
            # NOT mounted: pnpm-workspace.yaml. pnpm@12 rewrites it during install
            # (write-temp + atomic rename), which fails EBUSY against a single-file
            # bind mount. The image bakes it, so a change there needs a rebuild.
            - ./services/ai-model-registry/package.json:/usr/src/service/package.json:cached
            # Host packages, mounted read-only outside the pnpm workspace root and
            # rsynced into the container's own copy, so host edits reach a running
            # service and pnpm never writes node_modules back to the host.
            # See scripts/docker/workspace-package-sync.sh.
            - ./packages/lixpi:/usr/src/host-packages/lixpi:ro,cached
            - ./scripts/docker/workspace-package-sync.sh:/usr/local/bin/workspace-package-sync.sh:ro,cached
            # Directory mount: the parameter tree lives here and the server
            # writes each file through a temp file and a rename.
            - ./services/ai-model-registry/data:/usr/src/service/data
            - aws-config:/root/.aws:cached    # AWS SSO credentials
            - ./.aws/config:/root/.aws/config:cached    # AWS SSO profile definitions
        working_dir: /usr/src/service
        # Install first, so a dependency added on the host is present before either
        # process starts. Then Vite serves the client with HMR while `node --watch`
        # restarts the API server when its own sources change.
        # --config.confirm-modules-purge=false: let pnpm purge and reinstall a stale
        # node_modules non-interactively, since the container has no TTY to ask.
        command: >
            /usr/local/bin/workspace-package-sync.sh run
            sh -c "pnpm i --config.confirm-modules-purge=false
            && { node --watch --experimental-transform-types ./src/server.ts & }
            && exec ./node_modules/.bin/vite --host 0.0.0.0"
        stop_signal: SIGTERM
        ports:
            - 3010:3010
        networks:
            - nats

    lixpi-caddy:
        container_name: lixpi-caddy
        profiles: ["deploy"]
        image: lixpi/caddy-cert-manager
        build:
            dockerfile: Dockerfile
            context: infrastructure/pulumi/src/resources/certificate-manager
        environment:
            # Local development mode
            CADDY_LOCAL_MODE: "true"
            DOMAINS: "localhost"
            CADDY_EMAIL: ${CERTIFICATE_VALIDATION_EMAIL}
            STORAGE_TYPE: "local"
        volumes:
            - caddy-certs:/certificates
        networks:
            - nats
        # Container exits after generating certificates - no ports needed
        restart: "no"

    lixpi-localauth0:
        container_name: lixpi-localauth0
        profiles: ["main"]
        image: lixpi/localauth0
        build:
            context: services/localauth0
            dockerfile: Dockerfile
        ports:
            - 3000:3000
        volumes:
            - localauth0-data:/data
        networks:
            - nats
        healthcheck:
            test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/.well-known/jwks.json"]
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 5s


    lixpi-nats-1:
        container_name: lixpi-nats-1
        profiles: ["main"]
        image: lixpi/nats
        build:
            dockerfile: Dockerfile
            context: services/nats
        # depends_on:
            # lixpi-caddy:
            #     condition: service_completed_successfully
        ports:
            - 4222:4222
            - 8222:8222
            - 9222:443    # websockets port (host:container)
        environment:
            # NATS config
            NATS_CLUSTER_NAME: Lixpi-NATS
            NATS_SERVER_NAME: Lixpi-NATS-1  # Explicit server name for each instance
            NATS_DEBUG_MODE: ${NATS_DEBUG_MODE}
            NATS_TRACE_MODE: ${NATS_TRACE_MODE}
            NATS_SYS_USER_PASSWORD: ${NATS_SYS_USER_PASSWORD}
            NATS_REGULAR_USER_PASSWORD: ${NATS_REGULAR_USER_PASSWORD}
            NATS_AUTH_NKEY_ISSUER_PUBLIC: ${NATS_AUTH_NKEY_ISSUER_PUBLIC}
            NATS_AUTH_XKEY_ISSUER_PUBLIC: ${NATS_AUTH_XKEY_ISSUER_PUBLIC}
            NATS_LLM_SERVICE_NKEY_PUBLIC: ${NATS_LLM_SERVICE_NKEY_PUBLIC}
            NATS_NEX_NODE_NKEY_PUBLIC: ${NATS_NEX_NODE_NKEY_PUBLIC}
            NATS_AI_MODEL_REGISTRY_NKEY_PUBLIC: ${NATS_AI_MODEL_REGISTRY_NKEY_PUBLIC}
            NATS_SAME_ORIGIN: ${NATS_SAME_ORIGIN}
            NATS_ALLOWED_ORIGINS: ${NATS_ALLOWED_ORIGINS}
            # Certificate management (always required for TLS)
            USE_REAL_CERTIFICATES: "true"
            CERT_STORAGE_TYPE: "local"
            CERT_LOCAL_PATH: "/opt/nats/certs"
            # Domain name for WebSocket origins
            DOMAIN_NAME: ${DOMAIN_NAME}
        volumes:
            - caddy-certs:/opt/nats/certs:ro  # Read-only certificates from Caddy
            - nats-1-data:/data                # Persistent JetStream storage
        command: [
            "--config", "/opt/nats/nats-server.conf",
            "--routes", "nats://sys:${NATS_SYS_USER_PASSWORD}@lixpi-nats-1:6222,nats://sys:${NATS_SYS_USER_PASSWORD}@lixpi-nats-2:6222,nats://sys:${NATS_SYS_USER_PASSWORD}@lixpi-nats-3:6222"
        ]
        networks:
            - nats
        healthcheck:
            test: ["CMD-SHELL", "wget -q --spider http://localhost:8222/healthz || exit 1"]
            interval: 5s
            timeout: 5s
            retries: 5
            start_period: 15s

    lixpi-nats-2:
        container_name: lixpi-nats-2
        profiles: ["main"]
        image: lixpi/nats-2
        pull_policy: never
        build:
            dockerfile: Dockerfile
            context: services/nats
        # depends_on:
            # lixpi-caddy:
            #     condition: service_completed_successfully
        environment:
            # NATS config
            NATS_CLUSTER_NAME: Lixpi-NATS
            NATS_SERVER_NAME: Lixpi-NATS-2  # Explicit server name for each instance
            NATS_DEBUG_MODE: ${NATS_DEBUG_MODE}
            NATS_TRACE_MODE: ${NATS_TRACE_MODE}
            NATS_SYS_USER_PASSWORD: ${NATS_SYS_USER_PASSWORD}
            NATS_REGULAR_USER_PASSWORD: ${NATS_REGULAR_USER_PASSWORD}
            NATS_AUTH_NKEY_ISSUER_PUBLIC: ${NATS_AUTH_NKEY_ISSUER_PUBLIC}
            NATS_AUTH_XKEY_ISSUER_PUBLIC: ${NATS_AUTH_XKEY_ISSUER_PUBLIC}
            NATS_LLM_SERVICE_NKEY_PUBLIC: ${NATS_LLM_SERVICE_NKEY_PUBLIC}
            NATS_NEX_NODE_NKEY_PUBLIC: ${NATS_NEX_NODE_NKEY_PUBLIC}
            NATS_AI_MODEL_REGISTRY_NKEY_PUBLIC: ${NATS_AI_MODEL_REGISTRY_NKEY_PUBLIC}
            NATS_SAME_ORIGIN: ${NATS_SAME_ORIGIN}
            NATS_ALLOWED_ORIGINS: ${NATS_ALLOWED_ORIGINS}
            # Certificate management (always required for TLS)
            USE_REAL_CERTIFICATES: "true"
            CERT_STORAGE_TYPE: "local"
            CERT_LOCAL_PATH: "/opt/nats/certs"
            # Domain name for WebSocket origins
            DOMAIN_NAME: ${DOMAIN_NAME}
        volumes:
            - caddy-certs:/opt/nats/certs:ro  # Read-only certificates from Caddy
            - nats-2-data:/data                # Persistent JetStream storage
        command: [
            "--config", "/opt/nats/nats-server.conf",
            "--routes", "nats://sys:${NATS_SYS_USER_PASSWORD}@lixpi-nats-1:6222,nats://sys:${NATS_SYS_USER_PASSWORD}@lixpi-nats-2:6222,nats://sys:${NATS_SYS_USER_PASSWORD}@lixpi-nats-3:6222"
        ]
        networks:
            - nats
        healthcheck:
            test: ["CMD-SHELL", "wget -q --spider http://localhost:8222/healthz || exit 1"]
            interval: 5s
            timeout: 5s
            retries: 5
            start_period: 15s

    lixpi-nats-3:
        container_name: lixpi-nats-3
        profiles: ["main"]
        image: lixpi/nats-3
        pull_policy: never
        build:
            dockerfile: Dockerfile
            context: services/nats
        # depends_on:
            # lixpi-caddy:
            #     condition: service_completed_successfully
        environment:
            # NATS config
            NATS_CLUSTER_NAME: Lixpi-NATS
            NATS_SERVER_NAME: Lixpi-NATS-3  # Explicit server name for each instance
            NATS_DEBUG_MODE: ${NATS_DEBUG_MODE}
            NATS_TRACE_MODE: ${NATS_TRACE_MODE}
            NATS_SYS_USER_PASSWORD: ${NATS_SYS_USER_PASSWORD}
            NATS_REGULAR_USER_PASSWORD: ${NATS_REGULAR_USER_PASSWORD}
            NATS_AUTH_NKEY_ISSUER_PUBLIC: ${NATS_AUTH_NKEY_ISSUER_PUBLIC}
            NATS_AUTH_XKEY_ISSUER_PUBLIC: ${NATS_AUTH_XKEY_ISSUER_PUBLIC}
            NATS_LLM_SERVICE_NKEY_PUBLIC: ${NATS_LLM_SERVICE_NKEY_PUBLIC}
            NATS_NEX_NODE_NKEY_PUBLIC: ${NATS_NEX_NODE_NKEY_PUBLIC}
            NATS_AI_MODEL_REGISTRY_NKEY_PUBLIC: ${NATS_AI_MODEL_REGISTRY_NKEY_PUBLIC}
            NATS_SAME_ORIGIN: ${NATS_SAME_ORIGIN}
            NATS_ALLOWED_ORIGINS: ${NATS_ALLOWED_ORIGINS}
            # Certificate management (always required for TLS)
            USE_REAL_CERTIFICATES: "true"
            CERT_STORAGE_TYPE: "local"
            CERT_LOCAL_PATH: "/opt/nats/certs"
            # Domain name for WebSocket origins
            DOMAIN_NAME: ${DOMAIN_NAME}
        volumes:
            - caddy-certs:/opt/nats/certs:ro  # Read-only certificates from Caddy
            - nats-3-data:/data                # Persistent JetStream storage
        command: [
            "--config", "/opt/nats/nats-server.conf",
            "--routes", "nats://sys:${NATS_SYS_USER_PASSWORD}@lixpi-nats-1:6222,nats://sys:${NATS_SYS_USER_PASSWORD}@lixpi-nats-2:6222,nats://sys:${NATS_SYS_USER_PASSWORD}@lixpi-nats-3:6222"
        ]
        networks:
            - nats
        healthcheck:
            test: ["CMD-SHELL", "wget -q --spider http://localhost:8222/healthz || exit 1"]
            interval: 5s
            timeout: 5s
            retries: 5
            start_period: 15s

    lixpi-nats-cli:
        container_name: lixpi-nats-cli
        profiles: ["dev"]
        image: synadia/nats-box:latest
        command: >
            -c "sleep infinity"
        stop_signal: SIGTERM
        networks:
            - nats

    lixpi-nex-1:
        container_name: lixpi-nex-1
        profiles: ["main"]
        image: lixpi/nex
        build:
            dockerfile: services/nex/Dockerfile
            context: .
        environment:
            # Force color output in the terminal, required for chalk.js to work
            FORCE_COLOR: 1

            # Pulumi/app config also consumed by the workload
            ORG_NAME: ${ORG_NAME}
            STAGE: ${STAGE}
            ENVIRONMENT: ${ENVIRONMENT}

            # AWS credentials, used only for local development
            AWS_REGION: ${AWS_REGION}
            AWS_PROFILE: ${AWS_PROFILE}

            # DynamoDB config (the workload writes the AI_MODELS_LIST table)
            DYNAMODB_ENDPOINT: ${DYNAMODB_ENDPOINT}

            # NEX node -> NATS connection. The client port (4222) is plain nats://
            # locally (no TLS on 4222), so the Go nex client must use nats:// URLs.
            NATS_SERVERS: "nats://lixpi-nats-1:4222,nats://lixpi-nats-2:4222,nats://lixpi-nats-3:4222"
            NATS_NEX_NODE_NKEY_SEED: ${NATS_NEX_NODE_NKEY_SEED}
            NATS_NEX_NODE_NKEY_PUBLIC: ${NATS_NEX_NODE_NKEY_PUBLIC}
            NATS_AI_MODEL_REGISTRY_NKEY_PUBLIC: ${NATS_AI_MODEL_REGISTRY_NKEY_PUBLIC}
            # AUTH-account regular_user password — the file-conversion workload
            # connects with this (not the NEX node creds) so it can read/write the
            # workspace Object Store buckets that live in the AUTH account.
            NATS_REGULAR_USER_PASSWORD: ${NATS_REGULAR_USER_PASSWORD}
            NATS_JS_DOMAIN: lixpi
            NEX_NAMESPACE: system
            NEX_NODE_NAME: lixpi-nex-1

            # nex stores its resource/config dir under $XDG_CONFIG_HOME/nex; point
            # it at the persistent volume so it survives container restarts.
            XDG_CONFIG_HOME: /data

            # AI provider keys used by the models-sync workload
            OPENAI_API_KEY: ${OPENAI_API_KEY}
            ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
            # When true, ANTHROPIC_API_KEY is ignored and inference goes through AWS Bedrock.
            ANTHROPIC_USE_AWS_BEDROCK_INFERENCE: ${ANTHROPIC_USE_AWS_BEDROCK_INFERENCE:-false}
            GOOGLE_API_KEY: ${GOOGLE_API_KEY}
            STABLE_DIFFUSION_API_KEY: ${STABLE_DIFFUSION_API_KEY}
            # When true, STABLE_DIFFUSION_API_KEY is ignored and inference goes through AWS Bedrock.
            STABILITY_USE_AWS_BEDROCK_INFERENCE: ${STABILITY_USE_AWS_BEDROCK_INFERENCE:-false}
            # BytePlus ModelArk (Seedance) — forwarded for parity with the API/entrypoint key
            # set (entrypoint.sh relays ARK_API_KEY to the nexlet). The models-sync workload
            # injects Seedance statically and makes no BytePlus call, so this is future-proofing.
            ARK_API_KEY: ${ARK_API_KEY:-}
            BYTEPLUS_ARK_API_KEY: ${BYTEPLUS_ARK_API_KEY:-}

        volumes:
            - aws-config:/root/.aws:cached    # AWS SSO credentials
            - ./.aws/config:/root/.aws/config:cached    # AWS SSO credentials
            - caddy-certs:/opt/nex/certs:ro    # Cluster CA (only needed when 4222 uses TLS, e.g. AWS)
            - nex-1-data:/data                 # Persistent nex resource/config dir across restarts
            - nex-workloads:/opt/nex/private-workloads:ro # Private repos place native workload binaries here
            - ./services/nex/pnpm-workspace.yaml:/usr/src/service/pnpm-workspace.yaml:cached

            # Host packages, mounted READ-ONLY and outside the pnpm workspace root. The
            # copy the service actually uses lives in the container's writable layer at
            # /usr/src/service/packages/lixpi and is rsynced from here every second, so
            # host edits reach a running service without a restart and pnpm can write
            # each package's node_modules without ever touching the host.
            # See scripts/docker/workspace-package-sync.sh.
            - ./packages/lixpi:/usr/src/host-packages/lixpi:ro,cached
            - ./scripts/docker/workspace-package-sync.sh:/usr/local/bin/workspace-package-sync.sh:ro,cached

        networks:
            - nats

        working_dir: /usr/src/service
        stop_signal: SIGTERM
        healthcheck:
            test: ["CMD-SHELL", "pidof nex >/dev/null 2>&1 || exit 1"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s
        depends_on:
            lixpi-nats-1:
                condition: service_healthy
                restart: true
            lixpi-nats-2:
                condition: service_healthy
                restart: true
            lixpi-nats-3:
                condition: service_healthy
                restart: true
            lixpi-dynamodb:
                condition: service_healthy
                restart: true
            lixpi-api:
                condition: service_healthy
                restart: true

    lixpi-web-ui:
        container_name: lixpi-web-ui
        profiles: ["main"]
        image: lixpi/web-ui
        build:
            dockerfile: services/web-ui/Dockerfile
            context: .
        environment:
            VITE_MOCK_AUTH: ${VITE_MOCK_AUTH}
            VITE_MOCK_AUTH0_DOMAIN: ${VITE_MOCK_AUTH0_DOMAIN}
            VITE_API_URL: ${VITE_API_URL}
            VITE_AUTH0_LOGIN_URL: ${VITE_AUTH0_LOGIN_URL}
            VITE_AUTH0_DOMAIN: ${VITE_AUTH0_DOMAIN}
            VITE_AUTH0_CLIENT_ID: ${VITE_AUTH0_CLIENT_ID}
            VITE_AUTH0_AUDIENCE: ${VITE_AUTH0_AUDIENCE}
            VITE_AUTH0_REDIRECT_URI: ${VITE_AUTH0_REDIRECT_URI}
            VITE_STRIPE_PUBLIC_KEY: ${VITE_STRIPE_PUBLIC_KEY}
            VITE_NATS_SERVER: ${VITE_NATS_SERVER}
        volumes:
            - ./services/web-ui/Dockerfile:/usr/src/service/Dockerfile:cached
            - ./services/web-ui/index.html:/usr/src/service/index.html:cached
            - ./services/web-ui/jsconfig.json:/usr/src/service/jsconfig.json:cached
            - ./services/web-ui/package.json:/usr/src/service/package.json:cached

            # NOT mounted: pnpm@12 rewrites pnpm-workspace.yaml during install (write-temp + atomic
            # rename), which fails EBUSY against a single-file bind mount on Docker Desktop/Windows.
            # The image bakes this file (services/web-ui/Dockerfile), so the container uses the baked
            # copy and pnpm's rewrite lands in the writable layer. Rebuild the image to pick up edits.
            # - ./services/web-ui/pnpm-workspace.yaml:/usr/src/service/pnpm-workspace.yaml:cached

            - ./services/web-ui/public:/usr/src/service/public:cached
            # - ./services/web-ui/dist:/usr/src/service/dist:cached    # Build output directory

            - ./services/web-ui/src:/usr/src/service/src:cached

            - ./services/web-ui/vite.config.ts:/usr/src/service/vite.config.ts:cached


            - ./services/web-ui/tsconfig.json:/usr/src/service/tsconfig.json:cached


            # Host packages, mounted READ-ONLY and outside the pnpm workspace root. The
            # copy the service actually uses lives in the container's writable layer at
            # /usr/src/service/packages/lixpi and is rsynced from here every second, so
            # host edits reach a running service without a restart and pnpm can write
            # each package's node_modules without ever touching the host.
            # See scripts/docker/workspace-package-sync.sh.
            - ./packages/lixpi:/usr/src/host-packages/lixpi:ro,cached
            - ./scripts/docker/workspace-package-sync.sh:/usr/local/bin/workspace-package-sync.sh:ro,cached

            # - ./packages-vendor/bits-ui/packages/bits-ui:/usr/src/service/packages/bits-ui

            # CA certificate for browser installation
            - caddy-certs:/usr/src/service/public/certs:ro

        networks:
            - nats

        working_dir: /usr/src/service
        # making sure we install the packages before running the dev server
        # command: >
        #     pnpm run build-and-serve
        # --config.confirm-modules-purge=false: let pnpm purge+reinstall a stale node_modules
        # non-interactively (no TTY in the container) instead of aborting. Narrower than CI=true,
        # which would also force --frozen-lockfile.
        command: >
            /usr/local/bin/workspace-package-sync.sh run
            sh -c "pnpm i --config.confirm-modules-purge=false
            && pnpm run dev"
        stop_signal: SIGTERM
        ports:
            - 3001:5173
        # depends_on:
        #     lixpi-api:
        #         condition: service_healthy
        #         restart: true
        #     lixpi-nex-1:
        #         condition: service_healthy
        #         restart: true

    lixpi-web-ui-user-portal:
        container_name: lixpi-web-ui-user-portal
        profiles: ["main"]
        image: lixpi/web-ui-user-portal
        build:
            dockerfile: services/web-ui-user-portal/Dockerfile
            context: .
        environment:
            VITE_MOCK_AUTH: ${VITE_MOCK_AUTH}
            VITE_MOCK_AUTH0_DOMAIN: ${VITE_MOCK_AUTH0_DOMAIN}
            VITE_AUTH0_DOMAIN: ${VITE_AUTH0_DOMAIN}
            VITE_AUTH0_CLIENT_ID: ${VITE_AUTH0_CLIENT_ID}
            VITE_AUTH0_AUDIENCE: ${VITE_AUTH0_AUDIENCE}
            VITE_AUTH0_REDIRECT_URI: ${VITE_USER_PORTAL_URL:-http://localhost:3002}
            VITE_NATS_SERVER: ${VITE_NATS_SERVER}
        volumes:
            - ./services/web-ui-user-portal/Dockerfile:/usr/src/service/Dockerfile:cached
            - ./services/web-ui-user-portal/index.html:/usr/src/service/index.html:cached
            - ./services/web-ui-user-portal/package.json:/usr/src/service/package.json:cached
            - ./services/web-ui-user-portal/src:/usr/src/service/src:cached
            - ./services/web-ui-user-portal/vite.config.ts:/usr/src/service/vite.config.ts:cached
            - ./services/web-ui-user-portal/tsconfig.json:/usr/src/service/tsconfig.json:cached
            - ./packages/lixpi:/usr/src/host-packages/lixpi:ro,cached
            - ./scripts/docker/workspace-package-sync.sh:/usr/local/bin/workspace-package-sync.sh:ro,cached
        networks:
            - nats
        working_dir: /usr/src/service
        command: >
            /usr/local/bin/workspace-package-sync.sh run
            sh -c "pnpm i --config.confirm-modules-purge=false
            && pnpm run dev"
        stop_signal: SIGTERM
        ports:
            - 3002:5173

    lixpi-api:
        container_name: lixpi-api
        profiles: ["main"]
        restart: always
        image: lixpi/api
        build:
            dockerfile: services/api/Dockerfile
            context: .
        environment:
            # Force color output in the terminal, required for chalk.js to work
            FORCE_COLOR: 1

            # Node 24 strips erasable TypeScript by default, but the API loads
            # enums and parameter properties from workspace sources. Transform
            # types is still required and still emits ExperimentalWarning.
            NODE_OPTIONS: '--trace-deprecation --abort-on-uncaught-exception --trace-warnings --disable-warning=ExperimentalWarning --experimental-transform-types'

            # Pulumi Config that's also used by the API
            ORG_NAME: ${ORG_NAME}
            STAGE: ${STAGE}
            ENVIRONMENT: ${ENVIRONMENT}

            # AWS credentials, used only for local development
            AWS_REGION: ${AWS_REGION}
            AWS_PROFILE: ${AWS_PROFILE}

            # DynamoDB config
            DYNAMODB_ENDPOINT: ${DYNAMODB_ENDPOINT}

            # App host addresses
            ORIGIN_HOST_URL: ${ORIGIN_HOST_URL}
            API_HOST_URL: ${API_HOST_URL}

            # Auth0 config
            AUTH0_DOMAIN: ${AUTH0_DOMAIN}
            AUTH0_API_IDENTIFIER: ${AUTH0_API_IDENTIFIER}

            # LocalAuth0 mock config
            MOCK_AUTH0: ${MOCK_AUTH0}
            MOCK_AUTH0_DOMAIN: ${MOCK_AUTH0_DOMAIN}
            MOCK_AUTH0_JWKS_URI: ${MOCK_AUTH0_JWKS_URI}

            # NATS config
            NATS_SERVERS: ${NATS_SERVERS}
            NATS_AUTH_ACCOUNT: ${NATS_AUTH_ACCOUNT}
            NATS_AUTH_NKEY_ISSUER_SEED: ${NATS_AUTH_NKEY_ISSUER_SEED}
            NATS_AUTH_XKEY_ISSUER_SEED: ${NATS_AUTH_XKEY_ISSUER_SEED}
            NATS_SYS_USER_PASSWORD: ${NATS_SYS_USER_PASSWORD}
            NATS_REGULAR_USER_PASSWORD: ${NATS_REGULAR_USER_PASSWORD}
            NATS_NEX_NODE_NKEY_PUBLIC: ${NATS_NEX_NODE_NKEY_PUBLIC}
            NATS_AI_MODEL_REGISTRY_NKEY_PUBLIC: ${NATS_AI_MODEL_REGISTRY_NKEY_PUBLIC}

            # AI config — provider keys + LLM workflow circuit breaker (formerly llm-api)
            OPENAI_API_KEY: ${OPENAI_API_KEY}
            ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
            # When true, ANTHROPIC_API_KEY is ignored and inference goes through AWS Bedrock.
            ANTHROPIC_USE_AWS_BEDROCK_INFERENCE: ${ANTHROPIC_USE_AWS_BEDROCK_INFERENCE:-false}
            GOOGLE_API_KEY: ${GOOGLE_API_KEY}
            # Veo person-generation policy profile (standard|restricted). Required for any
            # Veo call — the Google media profile fails the run when it is unset.
            GOOGLE_VEO_PERSON_GENERATION_PROFILE: ${GOOGLE_VEO_PERSON_GENERATION_PROFILE}
            STABLE_DIFFUSION_API_KEY: ${STABLE_DIFFUSION_API_KEY}
            # When true, STABLE_DIFFUSION_API_KEY is ignored and inference goes through AWS Bedrock.
            STABILITY_USE_AWS_BEDROCK_INFERENCE: ${STABILITY_USE_AWS_BEDROCK_INFERENCE:-false}
            # BytePlus ModelArk (Seedance 2.0 video). The provider reads BYTEPLUS_ARK_API_KEY
            # or ARK_API_KEY; forward both so whichever name the .env sets reaches the
            # container (the unset one defaults to empty and is ignored by the provider's ||).
            ARK_API_KEY: ${ARK_API_KEY:-}
            BYTEPLUS_ARK_API_KEY: ${BYTEPLUS_ARK_API_KEY:-}
            LLM_TIMEOUT_SECONDS: 1200
            SAVE_LLM_RESPONSES_TO_DEBUG_DIR: ${SAVE_LLM_RESPONSES_TO_DEBUG_DIR}

            METRICS_ENABLED: ${METRICS_ENABLED:-false}

        volumes:
            - aws-config:/root/.aws:cached    # AWS SSO credentials
            - ./.aws/config:/root/.aws/config:cached    # AWS SSO credentials
            - ./services/api/package.json:/usr/src/service/package.json:cached
            # NOT mounted: pnpm@12 rewrites pnpm-workspace.yaml during install (write-temp + atomic
            # rename), which fails EBUSY against a single-file bind mount on Docker Desktop/Windows.
            # The image bakes this file (services/api/Dockerfile), so the container uses the baked
            # copy and pnpm's rewrite lands in the writable layer. Rebuild the image to pick up edits.
            # - ./services/api/pnpm-workspace.yaml:/usr/src/service/pnpm-workspace.yaml:cached
            - ./services/api/nodemon.json:/usr/src/service/nodemon.json:cached

            # tsconfig.json is needed for the IDE to understand the project structure, but NOT used by default by Node.js
            - ./services/api/tsconfig.json:/usr/src/service/tsconfig.json:cached

            - ./services/api/config:/usr/src/service/config:cached
            # nodemon's `exec` wrapper, which decides whether a crashed app should
            # take the container down. Mounted next to nodemon.json so editing it
            # does not need an image rebuild. See services/api/scripts/nodemon-exec.sh.
            - ./services/api/scripts:/usr/src/service/scripts:cached
            - ./services/api/src:/usr/src/service/src:cached
            - ./services/api/temp-ai-responses:/usr/src/service/temp-ai-responses:cached

            # Host packages, mounted READ-ONLY and outside the pnpm workspace root. The
            # copy the service actually uses lives in the container's writable layer at
            # /usr/src/service/packages/lixpi and is rsynced from here every second, so
            # host edits reach a running service without a restart and pnpm can write
            # each package's node_modules without ever touching the host.
            # See scripts/docker/workspace-package-sync.sh.
            - ./packages/lixpi:/usr/src/host-packages/lixpi:ro,cached
            - ./scripts/docker/workspace-package-sync.sh:/usr/local/bin/workspace-package-sync.sh:ro,cached

        networks:
            - nats

        working_dir: /usr/src/service
        # making sure we install the packages before running the dev server
        # --config.confirm-modules-purge=false: let pnpm purge+reinstall a stale node_modules
        # non-interactively (no TTY in the container) instead of aborting. Narrower than CI=true,
        # which would also force --frozen-lockfile.
        command: >
            /usr/local/bin/workspace-package-sync.sh run
            sh -c "pnpm i --config.confirm-modules-purge=false
            && pnpm run dev"
        # command: >
        #     pnpm run dev
        stop_signal: SIGTERM
        ports:
            - 3005:3000
            - 35795:35795
        healthcheck:
            test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/health-check || exit 1"]
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 30s
        depends_on:
            # lixpi-pulumi-init:
            #     condition: service_completed_successfully
            #     restart: true
            lixpi-dynamodb:
                condition: service_healthy
                restart: true
            lixpi-localauth0:
                condition: service_healthy
                restart: true
            lixpi-nats-1:
                condition: service_healthy
                restart: true
            lixpi-nats-2:
                condition: service_healthy
                restart: true
            lixpi-nats-3:
                condition: service_healthy
                restart: true

    lixpi-pulumi:
        container_name: lixpi-pulumi
        profiles: ["deploy"]
        restart: always
        image: lixpi/pulumi
        build:
            dockerfile: infrastructure/pulumi/Dockerfile
            context: .
        environment:
            # Force color output in the terminal, required for chalk.js to work
            FORCE_COLOR: 1

            # Node 24 strips erasable TypeScript by default, but Pulumi loads
            # @lixpi/constants, which exports runtime enums. Transform types is
            # still required and still emits ExperimentalWarning.
            NODE_OPTIONS: '--trace-deprecation --abort-on-uncaught-exception --trace-warnings --disable-warning=ExperimentalWarning --experimental-transform-types'

            # General config
            DOMAIN_NAME: ${DOMAIN_NAME}

            # SST & Pulumi shared
            STAGE: ${STAGE}
            ORG_NAME: ${ORG_NAME}
            ENVIRONMENT: ${ENVIRONMENT}

            # PULUMI
            STATE_STORAGE_URL: ${STATE_STORAGE_URL}
            PULUMI_CONFIG_PASSPHRASE: ${PULUMI_CONFIG_PASSPHRASE}
            HOSTED_ZONE_DNS_ROLE_ARN: ${HOSTED_ZONE_DNS_ROLE_ARN}
            PULUMI_DEBUG_COMMANDS: true

            # AWS
            AWS_REGION: ${AWS_REGION}
            AWS_PROFILE: ${AWS_PROFILE}
            HOSTED_ZONE_NAME: ${HOSTED_ZONE_NAME}
            AWS_ROUTE53_HOSTED_ZONE_ID: ${AWS_ROUTE53_HOSTED_ZONE_ID}
            AWS_ROUTE53_PARENT_HOSTED_ZONE_ID: ${AWS_ROUTE53_PARENT_HOSTED_ZONE_ID}
            CLOUDWATCH_LOG_RETENTION_DAYS: ${CLOUDWATCH_LOG_RETENTION_DAYS}
            CLOUDWATCH_CONTAINER_INSIGHTS_ENABLED: ${CLOUDWATCH_CONTAINER_INSIGHTS_ENABLED}

            # DynamoDB config
            DYNAMODB_ENDPOINT: ${DYNAMODB_ENDPOINT}

            # NATS config
            NATS_DEBUG_MODE: ${NATS_DEBUG_MODE}
            NATS_TRACE_MODE: ${NATS_TRACE_MODE}
            NATS_SERVERS: ${NATS_SERVERS}
            NATS_AUTH_ACCOUNT: ${NATS_AUTH_ACCOUNT}
            NATS_SYS_USER_PASSWORD: ${NATS_SYS_USER_PASSWORD}
            NATS_REGULAR_USER_PASSWORD: ${NATS_REGULAR_USER_PASSWORD}
            NATS_AUTH_NKEY_ISSUER_SEED: ${NATS_AUTH_NKEY_ISSUER_SEED}
            NATS_AUTH_NKEY_ISSUER_PUBLIC: ${NATS_AUTH_NKEY_ISSUER_PUBLIC}
            NATS_AUTH_XKEY_ISSUER_SEED: ${NATS_AUTH_XKEY_ISSUER_SEED}
            NATS_AUTH_XKEY_ISSUER_PUBLIC: ${NATS_AUTH_XKEY_ISSUER_PUBLIC}
            NATS_LLM_SERVICE_NKEY_SEED: ${NATS_LLM_SERVICE_NKEY_SEED}
            NATS_LLM_SERVICE_NKEY_PUBLIC: ${NATS_LLM_SERVICE_NKEY_PUBLIC}
            # NEX node nkey — passed through so `createNexNodeService` can put it in the node's task definition
            NATS_NEX_NODE_NKEY_SEED: ${NATS_NEX_NODE_NKEY_SEED}
            NATS_NEX_NODE_NKEY_PUBLIC: ${NATS_NEX_NODE_NKEY_PUBLIC}
            NATS_AI_MODEL_REGISTRY_NKEY_PUBLIC: ${NATS_AI_MODEL_REGISTRY_NKEY_PUBLIC}
            NATS_SAME_ORIGIN: ${NATS_SAME_ORIGIN}

            # App host addresses
            ORIGIN_HOST_URL: ${ORIGIN_HOST_URL}
            API_HOST_URL: ${API_HOST_URL}

            # Auth0 config
            AUTH0_DOMAIN: ${AUTH0_DOMAIN}
            AUTH0_API_IDENTIFIER: ${AUTH0_API_IDENTIFIER}

            # AI config
            SAVE_LLM_RESPONSES_TO_DEBUG_DIR: ${SAVE_LLM_RESPONSES_TO_DEBUG_DIR}
            OPENAI_API_KEY: ${OPENAI_API_KEY}
            ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
            # When true, ANTHROPIC_API_KEY is ignored and inference goes through AWS Bedrock.
            ANTHROPIC_USE_AWS_BEDROCK_INFERENCE: ${ANTHROPIC_USE_AWS_BEDROCK_INFERENCE:-false}
            GOOGLE_API_KEY: ${GOOGLE_API_KEY}
            # Veo person-generation policy profile (standard|restricted). Required for any
            # Veo call — the Google media profile fails the run when it is unset.
            GOOGLE_VEO_PERSON_GENERATION_PROFILE: ${GOOGLE_VEO_PERSON_GENERATION_PROFILE}
            STABLE_DIFFUSION_API_KEY: ${STABLE_DIFFUSION_API_KEY}
            # When true, STABLE_DIFFUSION_API_KEY is ignored and inference goes through AWS Bedrock.
            STABILITY_USE_AWS_BEDROCK_INFERENCE: ${STABILITY_USE_AWS_BEDROCK_INFERENCE:-false}
            # BytePlus ModelArk (Seedance) — passed through so Pulumi can put it on the
            # deployed API task definition (see pulumiProgram.ts). Both names forwarded.
            ARK_API_KEY: ${ARK_API_KEY:-}
            BYTEPLUS_ARK_API_KEY: ${BYTEPLUS_ARK_API_KEY:-}

            # Web-UI config
            VITE_API_URL: ${VITE_API_URL}
            VITE_AUTH0_LOGIN_URL: ${VITE_AUTH0_LOGIN_URL}
            VITE_AUTH0_DOMAIN: ${VITE_AUTH0_DOMAIN}
            VITE_AUTH0_CLIENT_ID: ${VITE_AUTH0_CLIENT_ID}
            VITE_AUTH0_AUDIENCE: ${VITE_AUTH0_AUDIENCE}
            VITE_AUTH0_REDIRECT_URI: ${VITE_AUTH0_REDIRECT_URI}
            VITE_STRIPE_PUBLIC_KEY: ${VITE_STRIPE_PUBLIC_KEY}
            VITE_NATS_SERVER: ${VITE_NATS_SERVER}

        volumes:
            # AWS SSO credentials
            - aws-config:/root/.aws:cached
            - ./.aws/config:/root/.aws/config:cached

            # Pulumi infrastructure
            - pulumi-local-state:/var/opt/lixpi/.pulumi-local-state

            # Allow container to access docker on the host machine so that it can build docker images inside the container utilizing docker on the host machine
            - /var/run/docker.sock:/var/run/docker.sock:cached
        working_dir: /usr/src/service
        entrypoint: /bin/bash
        # command: -c "pnpm install && pulumi up --stack dev --non-interactive"
        command: >
            -c "sleep infinity"
        networks:
            - nats

    lixpi-pulumi-init:
        container_name: lixpi-pulumi-init
        profiles: ["deploy"]
        image: lixpi/pulumi-init
        extends:
            service: lixpi-pulumi
        restart: "no"
        entrypoint: []
        working_dir: /usr/src/service/infrastructure/pulumi
        command: ["pnpm", "run", "deploy:local"]
        depends_on:
            lixpi-dynamodb:
                condition: service_healthy
                restart: true
            lixpi-caddy:
                condition: service_completed_successfully
volumes:
    aws-config:    # AWS SSO credentials volume that's shared between multiple containers
    pulumi-local-state:    # A volume where Pulumi stores stack state. Used only for local development.
    caddy-certs:   # Shared volume for certificate storage
    dynamodb-data: # Persistent storage for DynamoDB Local
    localauth0-data: # Persistent storage for LocalAuth0 mock service
    nats-1-data:   # Persistent JetStream storage for NATS node 1
    nats-2-data:   # Persistent JetStream storage for NATS node 2
    nats-3-data:   # Persistent JetStream storage for NATS node 3
    nex-1-data:    # Persistent nex resource/config dir for the NEX node
    nex-workloads: # Shared native workload binary volume for private repos
        name: lixpi-nex-workloads

networks:
    nats:
        name: nats
