networks:
    nats:
        name: nats

services:

    # No container_name: this service is invoked via `docker compose run --rm`
    # (never `up`/`exec`) so Compose creates a fresh, uniquely-named container
    # per invocation — always reflects the current compose config, and
    # concurrent invocations never collide on a fixed name.
    lixpi-typescript-test-runner:
        profiles: ["dev"]
        image: lixpi/typescript-test-runner
        build:
            dockerfile: services/typescript-test-runner/Dockerfile
            context: .
        environment:
            # web-ui source reads these via import.meta.env at module-eval time,
            # including in code paths exercised by tests (e.g. VITE_API_URL in
            # WorkspaceCanvas.ts) — mirrors the lixpi-web-ui service's env block.
            VITE_MOCK_AUTH: ${VITE_MOCK_AUTH}
            VITE_MOCK_AUTH0_DOMAIN: ${VITE_MOCK_AUTH0_DOMAIN}
            VITE_API_URL: ${VITE_API_URL}
            VITE_AUTH0_LOGIN_URL: ${VITE_AUTH0_LOGIN_URL}
            VITE_AUTH0_DOMAIN: ${VITE_AUTH0_DOMAIN}
            VITE_AUTH0_CLIENT_ID: ${VITE_AUTH0_CLIENT_ID}
            VITE_AUTH0_AUDIENCE: ${VITE_AUTH0_AUDIENCE}
            VITE_AUTH0_REDIRECT_URI: ${VITE_AUTH0_REDIRECT_URI}
            VITE_USER_PORTAL_URL: ${VITE_USER_PORTAL_URL}
            VITE_STRIPE_PUBLIC_KEY: ${VITE_STRIPE_PUBLIC_KEY}
            VITE_NATS_SERVER: ${VITE_NATS_SERVER}
            # Shared content-addressable pnpm store (see the named volume
            # below) — caches downloaded package content across runs. pnpm's
            # store has its own locking, so concurrent ephemeral containers
            # can safely read/write it at once. node_modules itself is a
            # separate concern: it lives in each domain's directory (mounted
            # below via the typescript-test-runner-node-modules-* volumes)
            # so pnpm's linking step is incremental across runs instead of
            # starting from an empty node_modules every time — the pnpm
            # store alone only avoids re-downloading, not re-linking.
            npm_config_store_dir: /pnpm-store
        volumes:
            - ./services/typescript-test-runner/run-tests.sh:/usr/src/service/run-tests.sh:cached
            - typescript-test-runner-pnpm-store:/pnpm-store

            # Documentation tests have their own dependencies and a read-only repository view.
            - ./:/repository:ro,cached
            - ./documentation/site/package.json:/usr/src/service/docs-site/package.json:cached
            - ./documentation/site/source-registry.mjs:/usr/src/service/docs-site/source-registry.mjs:ro,cached
            - ./documentation/site/source-registry.test.ts:/usr/src/service/docs-site/source-registry.test.ts:ro,cached
            - ./documentation/site/markdoc:/usr/src/service/docs-site/markdoc:ro,cached
            - typescript-test-runner-node-modules-docs-site:/usr/src/service/docs-site/node_modules

            # --- api domain (bind-mounts services/api's own files — same
            #     package.json/pnpm-workspace.yaml/vitest.config.ts the
            #     lixpi-api container uses, no separate copies) ---
